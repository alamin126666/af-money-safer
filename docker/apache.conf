ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /var/www/app/public>
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>
# never serve dotfiles
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
# PHP files that are not entry points
<FilesMatch "\.(md|json|lock|yml|yaml|env|log)$">
    Require all denied
</FilesMatch>
Header always unset X-Powered-By
